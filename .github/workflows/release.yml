name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/lite-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/lite-darwin-amd64 .
          GOOS=linux GOARCH=amd64 go build -o dist/lite-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/lite-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/lite-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Release ${{ github.event.inputs.version }}
          body: |
            Release ${{ github.event.inputs.version }}

            Single binary. Docker must be installed on the host.

            ```
            ./lite
            ```
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: dist/*
